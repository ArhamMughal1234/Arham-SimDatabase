<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

:root {
  --primary-red: #ff0041;
  --secondary-red: #ff0088;
  --dark-bg: #0a0a0e;
  --glass-bg: rgba(20, 10, 15, 0.6);
  --glass-border: rgba(255, 0, 65, 0.25);
  --glow-color: #ff0041;
  --text-primary: #ff0041;
  --text-secondary: #ff88aa;
}

[data-theme="light"] {
  --primary-red: #cc0033;
  --secondary-red: #ff0044;
  --dark-bg: #f5e8e9;
  --glass-bg: rgba(255, 255, 255, 0.7);
  --glass-border: rgba(204, 0, 51, 0.3);
  --glow-color: #cc0033;
  --text-primary: #4d001a;
  --text-secondary: #660022;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'juNaid', sans-serif;
  background: var(--dark-bg);
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(255, 0, 65, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(255, 0, 136, 0.08) 0%, transparent 50%);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: all 0.5s ease;
}

/* Welcome Popup */
.welcome-popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(15px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  animation: fadeIn 0.4s ease;
}

.popup-content {
  background: linear-gradient(145deg, rgba(30, 10, 15, 0.95), rgba(20, 5, 10, 0.95));
  border: 3px solid var(--primary-red);
  border-radius: 30px;
  padding: 50px 40px;
  max-width: 450px;
  width: 90%;
  text-align: center;
  box-shadow: 
    0 0 60px rgba(255, 0, 65, 0.5),
    inset 0 0 40px rgba(255, 0, 65, 0.1);
  animation: popupSlide 0.5s ease;
  position: relative;
  overflow: hidden;
}

.popup-content::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255, 0, 65, 0.1) 0%, transparent 70%);
  animation: rotate 10s linear infinite;
}

.popup-icon {
  font-size: 72px;
  color: var(--primary-red);
  margin-bottom: 25px;
  animation: bounce 2s ease-in-out infinite;
  filter: drop-shadow(0 0 30px var(--glow-color));
  position: relative;
  z-index: 1;
}

.popup-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 32px;

// Theme Toggle
function toggleTheme() {
  const body = document.body;
  const themeBtn = document.querySelector('.theme-toggle i');
  
  if (body.getAttribute('data-theme') === 'light') {
    body.removeAttribute('data-theme');
    themeBtn.className = 'fas fa-moon';
  } else {
    body.setAttribute('data-theme', 'light');
    themeBtn.className = 'fas fa-sun';
  }
}

// Menu Toggle
function toggleMenu() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('active');
}

// Close sidebar when clicking outside
document.addEventListener('click', function(event) {
  const sidebar = document.getElementById('sidebar');
  const menuToggle = document.querySelector('.menu-toggle');
  
  if (!sidebar.contains(event.target) && !menuToggle.contains(event.target)) {
    sidebar.classList.remove('active');
  }
});

// Search Form Handler
let currentUserData = null;

$('#searchForm').on('submit', function(e) {
  e.preventDefault();
  
  const input = $('#searchInput').val().trim();
  if (!input) {
    alert('⚠️ Please enter a mobile number or CNIC');
    return;
  }

  const resultsContainer = $('#resultsContainer');
  const resultsContent = $('#resultsContent');
  
  resultsContainer.addClass('active');
  resultsContent.html(`
    <div class="loading">
      <i class="fas fa-spinner"></i>
      <div>Scanning Database...</div>
    </div>
  `);

  const proxy = "https://api.allorigins.win/raw?url=";

  $.getJSON(proxy + encodeURIComponent(apiUrl), function(response) {

      currentUserData = response.data[0];
      displayResults(currentUserData);
    } else {
      resultsContent.html(`
        <div class="error-message">
          <i class="fas fa-exclamation-triangle"></i>
          <div>No Data Found</div>
        </div>

        <i class="fas fa-times-circle"></i>
        <div>Failed to connect to database</div>
      </div>

  });

        <div class="card-value">${data.cnic || 'N/A'}</div>

      ${data.father_name ? `

        <div class="card-label">Father Name</div>

        <div class="card-label">Complete Address</div>
        <div class="card-value">${data.address || 'N/A'}</div>
      </div>
    </div>
  `;
  
  $('#resultsContent').html(html);
}
</script>
